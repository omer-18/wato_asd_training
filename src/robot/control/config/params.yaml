control_node:
  ros__parameters:
    # Lookahead distance for Pure Pursuit Control (meters)
    # Larger values make motion smoother but less precise
    # Smaller values improve accuracy but can lead to sharper movements
    # Set to 1.2m for good balance between smoothness and precision
    lookahead_distance: 1.2
    
    # Distance to consider the goal reached (meters)
    # Robot will stop when within this distance of the final goal point
    goal_tolerance: 0.2
    
    # Constant forward speed (m/s)
    # The robot will maintain this linear velocity while following the path
    # Angular velocity is computed automatically based on path curvature
    # Set to 0.6 m/s for safer navigation around obstacles
    linear_speed: 0.6
    
    # Obstacle detection parameters
    # Distance ahead to check for obstacles (meters)
    # When robot is this close to obstacles and needs to make a sharp turn,
    # it will turn in place or reverse instead of trying to turn while moving forward
    obstacle_check_distance: 0.5
    
    # Cost value threshold for obstacles (0-100)
    # Cells with cost >= this value are considered obstacles
    # Lower values make the robot more cautious, higher values allow it to get closer
    obstacle_threshold: 50